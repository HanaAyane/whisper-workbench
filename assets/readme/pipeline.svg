<text x="654.8" y="177" font-size="17" font-weight="700" fill="#14182A">faster-whisper</text>
<text x="630.8" y="204" font-size="13.5" fill="#6C7690">本地 CTranslate2</text>
<text x="630.8" y="225" font-size="13.5" fill="#6C7690">int8 / bfloat16</text>
