<text x="263.6" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3C328F">2</text>
<text x="283.6" y="177" font-size="17" font-weight="700" fill="#14182A">PyAV 解码</text>
<text x="259.6" y="204" font-size="13.5" fill="#6C7690">16 kHz · 单声道</text>
<text x="259.6" y="225" font-size="13.5" fill="#6C7690">float32</text>
<path d="M405.6 194.0 L421.2 194.0" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round"/>
<path d="M417.2 190.0 L423.2 194.0 L417.2 198.0" fill="none" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="427.2" y="148" width="160" height="92" rx="14" fill="#FFFFFF" stroke="#DBDFEF" stroke-width="1.3"/>
<circle cx="449.2" cy="171" r="12" fill="#E7E3FB"/>
<text x="449.2" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3C328F">3</text>
<text x="469.2" y="177" font-size="17" font-weight="700" fill="#14182A">VAD 切分</text>
<text x="445.2" y="204" font-size="13.5" fill="#6C7690">ONNX 优先</text>
<text x="445.2" y="225" font-size="13.5" fill="#6C7690">≤ 30 秒 / 块</text>
