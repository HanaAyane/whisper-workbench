<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d" font-family="'Segoe UI','Microsoft YaHei UI','PingFang SC','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif">
<title id="t">Whisper工作台的工作流与数据边界</title>
<desc id="d">六步本地流水线：音频或媒体输入、PyAV 解码、VAD 切分、faster-whisper 本地转录、术语复核、导出字幕；下方单独标出可选的 DeepSeek 翻译只发送待翻译字幕文本。</desc>
<rect width="1200" height="380" rx="24" fill="#F7F8FD"/>
<text x="56" y="66" font-size="30" font-weight="800" fill="#14182A">本地优先的工作流</text>
<text x="56" y="98" font-size="17" fill="#6C7690">解码、VAD、ASR、术语复核与导出都在本机；只有启用翻译时才把待翻译字幕文本发给 DeepSeek。</text>
<rect x="934" y="44" width="210" height="40" rx="20" fill="#DDF3EA"/>
<circle cx="958" cy="64" r="4.5" fill="#0E7A5F"/>
<text x="972" y="70" font-size="15" font-weight="700" fill="#0E7A5F">音频不出本机</text>
<rect x="56.0" y="148" width="160" height="92" rx="14" fill="#FFFFFF" stroke="#DBDFEF" stroke-width="1.3"/>
<circle cx="78.0" cy="171" r="12" fill="#E7E3FB"/>
<text x="78.0" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3C328F">1</text>
<text x="98.0" y="177" font-size="17" font-weight="700" fill="#14182A">音频 / 媒体</text>
<text x="74.0" y="204" font-size="13.5" fill="#6C7690">WAV · MP3 · M4A</text>
<text x="74.0" y="225" font-size="13.5" fill="#6C7690">FLAC · MP4 · WEBM</text>
<path d="M220.0 194.0 L235.6 194.0" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round"/>
<path d="M231.6 190.0 L237.6 194.0 L231.6 198.0" fill="none" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
