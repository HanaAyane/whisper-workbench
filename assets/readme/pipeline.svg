<circle cx="820.4" cy="171" r="12" fill="#E7E3FB"/>
<text x="820.4" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3C328F">5</text>
<text x="840.4" y="177" font-size="17" font-weight="700" fill="#14182A">术语复核</text>
<text x="816.4" y="204" font-size="13.5" fill="#6C7690">原文纠错</text>
<text x="816.4" y="225" font-size="13.5" fill="#6C7690">译名统一 · 仅高亮</text>
<path d="M962.4 194.0 L978.0 194.0" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round"/>
<path d="M974.0 190.0 L980.0 194.0 L974.0 198.0" fill="none" stroke="#B9C0D6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="984.0" y="148" width="160" height="92" rx="14" fill="#FFFFFF" stroke="#DBDFEF" stroke-width="1.3"/>
<circle cx="1006.0" cy="171" r="12" fill="#E7E3FB"/>
<text x="1006.0" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#3C328F">6</text>
<text x="1026.0" y="177" font-size="17" font-weight="700" fill="#14182A">导出字幕</text>
<text x="1002.0" y="204" font-size="13.5" fill="#6C7690">SRT · VTT</text>
<text x="1002.0" y="225" font-size="13.5" fill="#6C7690">LRC · TXT</text>
<text x="600.0" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#0E7A5F">以上解码、VAD、ASR、术语复核与导出全部在本机执行，音频不上传。</text>
<path d="M692.8 240 L692.8 300" stroke="#E7C88B" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="56" y="300" width="1088" height="56" rx="12" fill="#FCF3DF" stroke="#E7C88B" stroke-width="1.3"/>
<circle cx="82" cy="328" r="5" fill="#94600D"/>
<text x="98" y="334" font-size="17" font-weight="700" fill="#94600D">可选 · DeepSeek 翻译</text>
<text x="270" y="334" font-size="15" fill="#39435A">启用翻译时仅把待翻译字幕文本发送到 api.deepseek.com，音频与文件都不上传。</text>
</svg>